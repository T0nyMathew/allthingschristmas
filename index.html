  <style>
    /* ==========================================================================
       1. DESIGN TOKENS, SPACING SCALE & TYPOGRAPHY SYSTEM
       ========================================================================== */
    :root {
      /* Brand Palette */
      --forest: #173B32;
      --forest-deep: #102B24;
      --forest-soft: #214E43;
      --burgundy: #762D38;
      --burgundy-dark: #5A2029;
      --ivory: #F6F1E8;
      --ivory-dark: #EBE3D5;
      --gold: #C6A66B;
      --gold-light: #DFC694;
      --gold-dark: #8A6B32;
      --charcoal: #282724;
      --charcoal-muted: #524F49;
      --sage: #A7B5A6;
      --sage-tint: #E5ECE4;
      --white: #FFFFFF;
      --danger: #9E2A2B;
      --danger-bg: #FDF2F2;

      /* Borders & Elevation */
      --border-subtle: rgba(40, 39, 36, 0.14);
      --border-strong: rgba(40, 39, 36, 0.26);
      --border-gold: rgba(198, 166, 107, 0.52);
      --shadow-sm: 0 4px 14px rgba(23, 59, 50, 0.06);
      --shadow-md: 0 12px 30px rgba(23, 59, 50, 0.10);
      --shadow-lg: 0 24px 54px rgba(16, 43, 36, 0.18);

      /* Radii */
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;

      /* Standardised Font Stacks */
      --font-serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
      --font-cormorant: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

      /* Typography Scale */
      --text-xs: 0.75rem;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-md: 1.125rem;
      --text-lg: clamp(1.2rem, 2vw, 1.45rem);
      --text-xl: clamp(1.65rem, 3.2vw, 2.65rem);
      --text-hero: clamp(1.95rem, 4.6vw, 3.75rem);

      /* Consistent Spacing Scale */
      --space-xs: 0.5rem;
      --space-sm: 0.875rem;
      --space-md: 1.35rem;
      --space-lg: 2.25rem;
      --space-xl: clamp(3rem, 5.5vw, 5.25rem);

      /* Layout Dimensions */
      --container-max: 1320px;
      --gutter: clamp(0.875rem, 3vw, 2.25rem);
      --header-h: 66px;
      --transition: 220ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    @media (min-width: 768px) {
      :root {
        --header-h: 74px;
      }
    }

    @media (min-width: 1440px) {
      :root {
        --container-max: 1380px;
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(var(--header-h) + 14px);
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-sans);
      font-size: var(--text-base);
      background-color: var(--ivory);
      color: var(--charcoal);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: clip;
      -webkit-font-smoothing: antialiased;
    }

    body.has-overlay-open {
      overflow: hidden;
    }

    img, svg, canvas {
      display: block;
      max-width: 100%;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    :focus-visible {
      outline: 2.5px solid var(--gold);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      html.reveal-ready [data-reveal] {
        opacity: 1 !important;
        transform: none !important;
      }
    }

    /* ==========================================================================
       2. PURPOSEFUL SCROLL REVEAL ANIMATIONS
       ========================================================================== */
    html.reveal-ready [data-reveal] {
      opacity: 0;
      transition:
        opacity 560ms cubic-bezier(0.22, 1, 0.36, 1),
        transform 620ms cubic-bezier(0.22, 1, 0.36, 1);
      transition-delay: var(--reveal-delay, 0ms);
    }

    html.reveal-ready [data-reveal="left"] {
      transform: translate3d(-28px, 10px, 0);
    }

    html.reveal-ready [data-reveal="right"] {
      transform: translate3d(28px, 10px, 0);
    }

    html.reveal-ready [data-reveal="zoom"] {
      transform: translate3d(0, 16px, 0) scale(0.97);
    }

    html.reveal-ready [data-reveal].is-revealed {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
    }

    /* ==========================================================================
       3. LAYOUT UTILITIES, TYPOGRAPHY & STANDARDISED BUTTONS
       ========================================================================== */
    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      z-index: 2000;
      padding: 0.75rem 1.25rem;
      background-color: var(--forest);
      color: var(--ivory);
      font-weight: 700;
    }

    .skip-link:focus {
      left: 0.75rem;
      top: 0.75rem;
    }

    .container {
      width: 100%;
      max-width: var(--container-max);
      margin-inline: auto;
      padding-inline: var(--gutter);
    }

    .section {
      padding-block: var(--space-xl);
      overflow-x: clip;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: var(--text-xs);
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--burgundy);
      margin-bottom: var(--space-xs);
    }

    .eyebrow--gold {
      color: var(--gold-light);
    }

    .eyebrow::before {
      content: "";
      width: 20px;
      height: 1.5px;
      background-color: currentColor;
      opacity: 0.8;
    }

    .section-heading {
      font-family: var(--font-serif);
      font-size: var(--text-xl);
      font-weight: 600;
      line-height: 1.18;
      letter-spacing: -0.015em;
      color: var(--forest);
      margin-bottom: var(--space-sm);
    }

    .section-heading--light {
      color: var(--ivory);
    }

    .section-lead {
      font-size: clamp(0.95rem, 1.3vw, 1.1rem);
      color: var(--charcoal-muted);
      max-width: 62ch;
    }

    .section-lead--light {
      color: rgba(246, 241, 232, 0.9);
    }

    .section-header {
      margin-bottom: var(--space-lg);
    }

    .section-header--center {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Standardised Button Hierarchy (Mobile-Friendly 48px Touch Targets) */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 48px;
      padding: 0.72rem 1.35rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.9375rem;
      line-height: 1.2;
      letter-spacing: 0.01em;
      text-align: center;
      transition: transform var(--transition), background-color var(--transition), border-color var(--transition), box-shadow var(--transition), color var(--transition);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    /* Primary CTA */
    .btn-primary {
      background-color: var(--burgundy);
      color: var(--white);
      box-shadow: 0 6px 18px rgba(118, 45, 56, 0.24);
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--burgundy-dark);
      transform: translateY(-1px);
    }

    /* Secondary Solid CTA */
    .btn-forest {
      background-color: var(--forest);
      color: var(--ivory);
      box-shadow: 0 6px 18px rgba(23, 59, 50, 0.18);
    }

    .btn-forest:hover:not(:disabled) {
      background-color: var(--forest-deep);
      transform: translateY(-1px);
    }

    /* Light Outline CTA (Dark Backgrounds) */
    .btn-outline-light {
      border: 1.5px solid rgba(246, 241, 232, 0.65);
      color: var(--ivory);
      background-color: rgba(246, 241, 232, 0.06);
    }

    .btn-outline-light:hover:not(:disabled) {
      border-color: var(--gold);
      background-color: rgba(198, 166, 107, 0.16);
      color: var(--white);
    }

    /* Dark Outline / Secondary CTA */
    .btn-outline-dark {
      border: 1.5px solid var(--forest);
      color: var(--forest);
      background-color: transparent;
    }

    .btn-outline-dark:hover:not(:disabled) {
      background-color: var(--forest);
      color: var(--ivory);
    }

    /* Destructive Action CTA */
    .btn-danger {
      border: 1.5px solid var(--danger);
      color: var(--danger);
      background-color: var(--danger-bg);
    }

    .btn-danger:hover:not(:disabled) {
      background-color: var(--danger);
      color: var(--white);
    }

    .btn-sm {
      min-height: 44px;
      padding: 0.55rem 0.95rem;
      font-size: 0.875rem;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Storage Warning Banner */
    .storage-alert-bar {
      background-color: #FFF6E5;
      border-bottom: 1px solid #D9A74A;
      color: #4A3409;
      font-size: var(--text-sm);
      padding: 0.6rem var(--gutter);
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      text-align: center;
    }

    .storage-alert-bar.is-visible {
      display: flex;
    }

    /* ==========================================================================
       4. STICKY NAVIGATION & COMPACT 320px-SAFE MOBILE HEADER
       ========================================================================== */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 900;
      height: var(--header-h);
      background-color: rgba(246, 241, 232, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      transition: box-shadow var(--transition), background-color var(--transition);
    }

    .site-header.is-scrolled {
      box-shadow: var(--shadow-sm);
      background-color: rgba(246, 241, 232, 0.99);
    }

    .nav-bar {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-family: var(--font-serif);
      font-size: clamp(0.96rem, 2.2vw, 1.28rem);
      font-weight: 700;
      color: var(--forest);
      letter-spacing: -0.01em;
      min-width: 0;
      flex-shrink: 1;
    }

    .brand-logo-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: var(--forest);
      color: var(--gold);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      border: 1px solid var(--gold);
    }

    @media (min-width: 380px) {
      .brand-mark {
        width: 30px;
        height: 30px;
      }
    }

    .nav-links {
      display: none;
      list-style: none;
      align-items: center;
      gap: clamp(0.65rem, 1.2vw, 1.25rem);
    }

    @media (min-width: 1120px) {
      .nav-links {
        display: flex;
      }
    }

    .nav-link {
      position: relative;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--charcoal);
      padding-block: 0.45rem;
      white-space: nowrap;
      transition: color var(--transition);
    }

    .nav-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 2px;
      background-color: var(--burgundy);
      transform: scaleX(0);
      transform-origin: right;
      transition: transform var(--transition);
    }

    .nav-link:hover,
    .nav-link.is-active {
      color: var(--forest);
      font-weight: 700;
    }

    .nav-link.is-active::after,
    .nav-link:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.15rem;
      flex-shrink: 0;
    }

    @media (min-width: 400px) {
      .nav-actions {
        gap: 0.35rem;
      }
    }

    .icon-btn {
      position: relative;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--forest);
      transition: background-color var(--transition), color var(--transition);
    }

    @media (min-width: 768px) {
      .icon-btn {
        width: 44px;
        height: 44px;
      }
    }

    .icon-btn:hover {
      background-color: rgba(23, 59, 50, 0.08);
    }

    /* Hide Guest Preferences icon in cramped < 480px header; accessible via Mobile Drawer */
    .header-account-btn {
      display: none;
    }

    @media (min-width: 480px) {
      .header-account-btn {
        display: inline-flex;
      }
    }

    .cart-badge {
      position: absolute;
      top: 3px;
      right: 2px;
      min-width: 18px;
      height: 18px;
      padding-inline: 4px;
      border-radius: 999px;
      background-color: var(--burgundy);
      color: var(--white);
      font-size: 0.6875rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .mobile-menu-btn {
      display: inline-flex;
    }

    @media (min-width: 1120px) {
      .mobile-menu-btn {
        display: none;
      }
    }

    /* Mobile / Tablet Navigation Drawer */
    .mobile-nav {
      position: fixed;
      top: var(--header-h);
      left: 0;
      right: 0;
      max-height: calc(100dvh - var(--header-h));
      overflow-y: auto;
      background-color: var(--ivory);
      border-bottom: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-lg);
      padding: 1rem var(--gutter) 1.75rem;
      z-index: 890;
      transform: translateY(-105%);
      opacity: 0;
      visibility: hidden;
      transition: transform var(--transition), opacity var(--transition), visibility var(--transition);
    }

    .mobile-nav.is-open {
      transform: translateY(0);
      opacity: 1;
      visibility: visible;
    }

    .mobile-nav-section-label {
      font-size: var(--text-xs);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--charcoal-muted);
      margin-bottom: 0.45rem;
      padding-inline: 0.5rem;
    }

    .mobile-nav-list {
      list-style: none;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.25rem;
      margin-bottom: 1.15rem;
    }

    @media (min-width: 560px) {
      .mobile-nav-list {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.35rem 0.75rem;
      }
    }

    .mobile-nav-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 46px;
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-sm);
      font-family: var(--font-serif);
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--forest);
    }

    .mobile-nav-link.is-active,
    .mobile-nav-link:hover {
      background-color: rgba(23, 59, 50, 0.08);
      color: var(--burgundy);
    }

    .mobile-nav-utilities {
      padding-top: 1rem;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    /* ==========================================================================
       5. HERO SECTION & REALISTIC 3D CHRISTMAS TREE STAGE
       ========================================================================== */
    .hero {
      position: relative;
      background-color: var(--forest);
      color: var(--ivory);
      overflow: hidden;
      padding-block: clamp(1.75rem, 4.5vw, 4.75rem) clamp(2.5rem, 5.5vw, 5.25rem);
    }

    .hero-snow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(2px 2px at 14% 24%, rgba(255, 255, 255, 0.3) 50%, transparent 100%),
        radial-gradient(2.5px 2.5px at 32% 68%, rgba(198, 166, 107, 0.4) 50%, transparent 100%),
        radial-gradient(2px 2px at 67% 32%, rgba(198, 166, 107, 0.3) 50%, transparent 100%),
        radial-gradient(2px 2px at 84% 72%, rgba(255, 255, 255, 0.28) 50%, transparent 100%);
    }

    .hero-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr;
      gap: clamp(1.75rem, 4vw, 3.5rem);
      align-items: center;
    }

    @media (min-width: 960px) {
      .hero-grid {
        grid-template-columns: 1.06fr 0.94fr;
      }
       <!-- ======================================================================
         SECTION 4: FESTIVE ACTIVITIES & GAMES
         ====================================================================== -->
    <section class="section" id="activities" aria-labelledby="activities-heading">
      <div class="container">
        <div class="section-header section-header--center" data-reveal="zoom">
          <span class="eyebrow">Festive Pastimes · Free to Play</span>
          <h2 class="section-heading" id="activities-heading">Games &amp; Holiday Cheer</h2>
          <p class="section-lead">
            Gather family and friends for three 10-question seasonal challenges—designed for quick one-handed play on mobile or living-room screen sharing.
          </p>
        </div>

        <div class="game-tabs" role="tablist" aria-label="Christmas Games Selector" data-reveal="left">
          <button type="button" class="game-tab is-active" role="tab" id="tab-trivia" aria-selected="true" aria-controls="game-stage-panel" data-game="trivia">
            1. Christmas Trivia (10 Qs)
          </button>
          <button type="button" class="game-tab" role="tab" id="tab-movies" aria-selected="false" aria-controls="game-stage-panel" data-game="movies">
            2. Guess the Movie (10 Qs)
          </button>
          <button type="button" class="game-tab" role="tab" id="tab-emoji" aria-selected="false" aria-controls="game-stage-panel" data-game="emoji">
            3. Emoji Carols (10 Qs)
          </button>
        </div>

        <div class="game-board" id="game-stage-panel" role="tabpanel" aria-labelledby="tab-trivia" data-reveal="right">
          <div id="game-content-area" aria-live="polite">
            <!-- Populated dynamically by JS -->
          </div>
        </div>
      </div>
    </section>

    <!-- ======================================================================
         SECTION 5: CURATED CHRISTMAS SHOP (WITH PRODUCT MOCKUPS)
         ====================================================================== -->
    <section class="section shop-section" id="shop" aria-labelledby="shop-heading">
      <div class="container">
        <div class="shop-top-bar">
          <div data-reveal="left">
            <span class="eyebrow">Curated Digital Keepsakes · Paid Downloads</span>
            <h2 class="section-heading" id="shop-heading">Festive Digital Catalogue</h2>
            <p class="section-lead">
              Preview realistic product mockups, exact file specifications and personal-use licences before adding items to your bag.
            </p>
          </div>

          <div class="filter-pills" role="group" aria-label="Filter Products by Category" data-reveal="right">
